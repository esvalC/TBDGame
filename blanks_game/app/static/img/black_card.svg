<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <pattern id="tex" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>
    <clipPath id="c"><rect x="0" y="0" width="250" height="350" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="250" height="350" fill="url(#g)"/>
    <rect width="250" height="350" fill="url(#tex)"/>
    <!-- corner glow -->
    <circle cx="250" cy="0" r="120" fill="#ffd23f" fill-opacity="0.06"/>
  </g>
  <rect x="1" y="1" width="248" height="348" rx="15" fill="none" stroke="#000" stroke-opacity="0.9" stroke-width="2"/>
  <rect x="7" y="7" width="236" height="336" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <!-- bottom mark: speech-bubble logo + blank -->
  <g transform="translate(14 314)">
    <path d="M0 4 a4 4 0 0 1 4-4 h24 a4 4 0 0 1 4 4 v10 a4 4 0 0 1-4 4 h-14 l-6 5 v-5 h-4 a4 4 0 0 1-4-4 z" fill="#ffd23f"/>
    <line x1="7" y1="10" x2="25" y2="10" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="50" y="330" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" fill-opacity="0.55" letter-spacing="2">BLANKS</text>
</svg>
