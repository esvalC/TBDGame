      <path d="M14 130 a4 4 0 0 1 4-4 h20 a4 4 0 0 1 4 4 v8 a4 4 0 0 1-4 4 h-12 l-5 4 v-4 h-3 a4 4 0 0 1-4-4 z" fill="#ffd23f"/>
